[package]
name = "board-roamer"
version = "3.1.3"
edition = "2021"
description = "A stylish multi-booru board viewer (e621 first)"

[dependencies]
tao = "0.34"
wry = "0.53"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
rust-embed = "8"
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
rcgen = "0.14"
mdns-sd = "0.22"
getrandom = "0.4"
hmac = "0.12"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
