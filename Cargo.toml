[package]
name = "board-roamer"
version = "1.3.0"
edition = "2021"
description = "A stylish multi-booru board viewer (e621 first)"

[dependencies]
tao = "0.34"
wry = "0.53"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
rust-embed = "8"
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
