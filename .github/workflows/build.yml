name: Build and release

# Every push to main builds everything (so a broken build is noticed straight away).
# It also publishes the downloads as the GitHub release for the version in Cargo.toml (which is what the in-app updater
# looks at): the first push of a version creates the release, later pushes of the same version refresh its files.
# Pushing a tag like v1.4.0 publishes that version instead.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: .exe }
          - { name: windows-x86,   os: windows-latest,   target: i686-pc-windows-msvc,      ext: .exe }
          - { name: windows-arm64, os: windows-latest,   target: aarch64-pc-windows-msvc,   ext: .exe }
          - { name: macos-arm64,   os: macos-latest,     target: aarch64-apple-darwin }
          - { name: macos-x64,     os: macos-latest,     target: x86_64-apple-darwin }
          - { name: linux-x64,     os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$V\"/m" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libayatana-appindicator3-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir dist
          V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          cp "target/${{ matrix.target }}/release/board-roamer${{ matrix.ext }}" "dist/board-roamer-${{ matrix.name }}${{ matrix.ext }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            bash .github/scripts/make_app.sh "target/${{ matrix.target }}/release/board-roamer" "$V" "dist/BoardRoamer-${{ matrix.name }}.zip"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$V\"/m" Cargo.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BR_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            echo "A release needs the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASS secrets (Settings > Secrets and variables > Actions)."
            exit 1
          else
            echo "No signing key here, so this APK is signed with a throw-away key (fine for a test build)."
            echo "BR_TEMP_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          BR_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          python android/build.py
          mkdir dist
          cp android/out/BoardRoamer.apk dist/BoardRoamer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/BoardRoamer.apk
          if-no-files-found: error

  release:
    name: publish release
    needs: [desktop, android]
    if: ${{ always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums (the in-app updater verifies downloads against this file)
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          # What changed: the description of the merged pull request. The app shows everything above the end-of-changes marker.
          bash .github/scripts/release_notes.sh "$GITHUB_SHA" > "$RUNNER_TEMP/changes.md" || true
          ANDROID="Android: Android or Play Protect may warn that the app is from an unknown source or not commonly installed. That is normal for an app installed outside Google Play. The APK asks for All files access (only for Settings > Local) and Install unknown apps (only for in-app updates). Details are in the README."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            # a later pull request under the same version adds its notes on top of the earlier ones
            MARK=$(grep -o '<!-- pr:[0-9]* -->' "$RUNNER_TEMP/changes.md" || true)
            OLD=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [ -s "$RUNNER_TEMP/changes.md" ] && ! grep -qF "$MARK" <<<"$OLD"; then
              if grep -q '^<!-- end-of-changes -->$' <<<"$OLD"; then OLD_CHANGES=$(sed '/^<!-- end-of-changes -->$/,$d' <<<"$OLD"); OLD_TAIL=$(sed -n '/^<!-- end-of-changes -->$/,$p' <<<"$OLD"); else OLD_CHANGES=""; OLD_TAIL=$'<!-- end-of-changes -->\n\n'"$OLD"; fi
              { cat "$RUNNER_TEMP/changes.md"; echo; [ -n "$OLD_CHANGES" ] && { echo "$OLD_CHANGES"; echo; }; echo "$OLD_TAIL"; } > "$RUNNER_TEMP/notes.md"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            { [ -s "$RUNNER_TEMP/changes.md" ] && { cat "$RUNNER_TEMP/changes.md"; echo; }; echo "<!-- end-of-changes -->"; echo; echo "$ANDROID"; } > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Board Roamer ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
